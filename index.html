<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#b6dddb">
  <meta name="description" content="Observatory — あなた自身による、あなたの観測所。生理周期や日々の体調を観測・記録するアプリ。">
  <title>Observatory | あなた自身による、あなたの観測所。</title>
  <style>
    :root { color-scheme: light; --text: #1a1a2e; --muted: #51566a; --accent: #1a1a2e; --border: #c8e4e2; --bg: #edf7f6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; line-height: 1.9; }
    main { max-width: 800px; margin: 48px auto; padding: 48px 52px; background: #fff; border: 1px solid var(--border); border-top: 5px solid #b6dddb; border-radius: 10px; }
    .brand { margin: 0 0 8px; color: var(--accent); font-size: 0.88rem; font-weight: 700; letter-spacing: .09em; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; line-height: 1.45; letter-spacing: .02em; }
    .updated { margin: 0 0 36px; color: var(--muted); font-size: .9rem; }
    section { margin-top: 36px; }
    h2 { margin: 0 0 14px; padding-bottom: 8px; border-bottom: 2px solid #b6dddb; font-size: 1.16rem; line-height: 1.6; }
    p { margin: 0 0 14px; }
    ul { margin: 0 0 16px; padding-left: 1.5em; }
    li { padding-left: .15em; }
    footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: .82rem; }
    a { color: var(--accent); text-underline-offset: .2em; }
    @media (max-width: 640px) { main { margin: 0; padding: 32px 22px 40px; border: 0; border-radius: 0; } h1 { font-size: 1.5rem; } section { margin-top: 30px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Observatory</h1>
      <p class="updated">あなた自身による、あなたの観測所。</p>
    </header>

    <section aria-labelledby="about-title">
      <h2 id="about-title">About Observatory</h2>
      <div class="about">
        <p>Observatory は、生理周期や日々の体調を自分自身で観測・記録するためのアプリです。</p>
        <p>蓄積されたデータから自分の身体の傾向を把握することを目指しています。</p>
        <p>行動の提案やアドバイスは行わず、主観のデータをありのままに記録し、提示することを大切にしています。</p>
        <p>スポーティーでシンプルなデザインが特徴です。</p>
      </div>
    </section>

     <section aria-labelledby="section-1">
      <h2 id="section-1">プライバシーポリシー</h2>
       <a href="./privacy-policy.html">プライバシーポリシー</a>
     </section>

     <footer>
       © rmfieldnotes
     </footer>
  </main>
</body>
</html>
